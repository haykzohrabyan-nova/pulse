<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Migration Tool</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f5; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        button { background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 1rem; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 1rem; color: #4b5563; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Pulse Database Synchronizer</h2>
        <p>This tool will automatically build your Supabase tables and move your local operator data to the cloud.</p>
        <button id="migrateBtn">Start Cloud Migration</button>
        <div id="status">Ready</div>
    </div>

    <script type="module">
        import { migrateIndexedDBToSupabase } from './src/supabase-client.js';

        document.getElementById('migrateBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "⏳ Connecting and migrating data...";
            
            try {
                if (typeof migrateIndexedDBToSupabase !== 'function') {
                    throw new Error("Migration function not found in supabase-client.js. Check the export!");
                }
                
                await migrateIndexedDBToSupabase((progress) => {
                    statusDiv.innerText = `⏳ Syncing Phase: ${progress.phase}...`;
                });
                
                statusDiv.innerHTML = "✅ <strong style='color: green;'>Migration Successful!</strong><br>You can close this tab and refresh your live app.";
            } catch (error) {
                statusDiv.innerHTML = `❌ <strong style='color: red;'>Error:</strong> ${error.message}`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
