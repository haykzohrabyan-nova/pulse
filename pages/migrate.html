<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Migration Tool</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f5; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        button { background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 1rem; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 1rem; color: #4b5563; font-weight: 500; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Pulse Database Synchronizer (Direct Link)</h2>
        <p>This tool will bypass file routing and sync your IndexedDB data directly into your Supabase Tables.</p>
        <button id="migrateBtn">Start Cloud Migration</button>
        <div id="status">Ready</div>
    </div>

    <script type="module">
        // Open the local browser database directly
        const openIndexedDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("pulse-db" || "PulseDB"); 
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        document.getElementById('migrateBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "⏳ Opening local database...";
            
            try {
                const db = await openIndexedDB();
                statusDiv.innerText = "⏳ Local database found!\nChecking for tables...";
                
                // Read local object stores (profiles, users, operators, etc.)
                const objectStoreNames = Array.from(db.objectStoreNames);
                if (objectStoreNames.length === 0) {
                    throw new Error("No local data found in this browser's cache to migrate.");
                }

                statusDiv.innerText = `⏳ Local data stores found: ${objectStoreNames.join(', ')}\nTriggering fallback function execution...`;
                
                // Execute the fallback logic directly
                if (window.migrateIndexedDBToSupabase) {
                    await window.migrateIndexedDBToSupabase((p) => {
                        statusDiv.innerText = `⏳ Syncing Phase: ${p.phase}...`;
                    });
                } else {
                    // Final fallback wrapper if it is trapped inside the bundle context
                    statusDiv.innerText = "⏳ Shaking hands with global script context...";
                    location.href = "javascript:if(window.migrateIndexedDBToSupabase){window.migrateIndexedDBToSupabase(p=>alert('Syncing...')).then(()=>alert('✅ Done!'))}else{alert('Please refresh the login screen and run the sync code directly there now that permissions are unlocked!')};void(0);";
                }
                
                statusDiv.innerHTML = "✅ <strong style='color: green;'>Migration Initiated Successfully!</strong><br>Check if an alert appeared, then return to the main application.";
            } catch (error) {
                statusDiv.innerHTML = `❌ <strong style='color: red;'>Notice:</strong> ${error.message}<br><br><span style='font-size:12px;color:gray;'>If no local cache is active on this sub-url, return to the main login screen, click the console, paste the command, and press Enter!</span>`;
                console.error(error);
            }
        });
    </script>
</body>
</html>
